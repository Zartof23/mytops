    <!-- Plain-text site summary for AI assistants and crawlers -->
    <link rel="llms" type="text/plain" href="/llms.txt" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />

    <!--
      Structured data. The SPA renders client-side, so this is most of what a
      non-JS crawler can learn about the site. The FAQ entries mirror
      src/components/FaqSection.tsx — jsonLd.test.ts fails if they drift.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://mytops.io/#website",
            "url": "https://mytops.io/",
            "name": "mytops",
            "description": "Create your personal collection of favorites. Rate movies, series, books, anime, games, and restaurants — and keep a list of what's next.",
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "@id": "https://mytops.io/#app",
            "name": "mytops",
            "url": "https://mytops.io/",
            "applicationCategory": "LifestyleApplication",
            "operatingSystem": "Any (web browser)",
            "isPartOf": { "@id": "https://mytops.io/#website" },
            "description": "An AI-powered single place to keep your tops organized across movies, series, books, anime, games and restaurants, plus everything you still want to watch, read, play or eat. If an item isn't in the database, AI finds it and imports it for everyone.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "featureList": [
              "Cross-topic search across movies, series, books, anime, games and restaurants",
              "Rate items 1-5 stars and build a personal favorites collection",
              "Keep a Watch Later list of things you still want to get to",
              "AI-powered enrichment that adds missing items to the catalog"
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://mytops.io/#faq",
            "isPartOf": { "@id": "https://mytops.io/#website" },
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is this?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "An AI-powered single place to keep your tops organized across every topic — movies, series, books, anime, games, restaurants — and everything you still want to do: watch, read, play, eat. Rate what you've already been through, list what's next. If it's not in the database, AI goes and finds it, and then it's in there permanently for everyone."
                }
              },
              {
                "@type": "Question",
                "name": "What can I track?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Six topics today: movies, series, books, anime, games, restaurants. More when someone asks for one convincingly enough."
                }
              },
              {
                "@type": "Question",
                "name": "Why does this exist?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "I wanted one organized, private list of my favorites across everything, and nothing covered all of it — especially the unconventional and indie picks. Building a database that contains everything anyone could ever want is impossible. So I figured the database itself could be built on demand. This site is mostly a proof of concept of that idea: the database gets built by AI as people search. Things get imported, and then they're there for everyone. It grows because you use it."
                }
              },
              {
                "@type": "Question",
                "name": "Is my data private?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Your ratings are yours and private by default. I don't sell anything to anyone. Public profiles are planned, opt-in, and not built yet."
                }
              },
              {
                "@type": "Question",
                "name": "Is it free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. I pay for the AI tokens. If you want to help, star the repo or buy me a coffee. Both work."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://ocasihbuejfjirsrnxzq.supabase.co" />
    <link rel="dns-prefetch" href="https://ocasihbuejfjirsrnxzq.supabase.co" />

    <div id="root"></div>
